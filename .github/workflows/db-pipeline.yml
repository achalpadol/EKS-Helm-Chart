
name: Database Build and Promote

on:
  push:
    branches: [main]
    paths:
      - "db/**"
      - "dev-chart/**"
      - ".github/workflows/db-pipeline.yml"

  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        type: choice
        default: dev
        options:
          - dev
          - qa
          - uat
          - prod
      image_tag:
        description: "Existing DEV image SHA for QA/UAT/PROD"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: db-${{ github.event_name == 'push' && 'dev' || inputs.environment }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: dev-eks-cluster
  IMAGE_REPOSITORY: ${{ secrets.DOCKER_USERNAME }}/employee-db
  TARGET_ENV: ${{ github.event_name == 'push' && 'dev' || inputs.environment }}
  IMAGE_TAG: ${{ github.event_name == 'push' && github.sha || inputs.environment == 'dev' && github.sha || inputs.image_tag }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'development' || inputs.environment == 'dev' && 'development' || inputs.environment == 'prod' && 'production' || inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$TARGET_ENV" != "dev" && -z "$IMAGE_TAG" ]]; then
            echo "Enter an existing DEV image SHA for QA/UAT/PROD."
            exit 1
          fi

          if [[ ! "$IMAGE_TAG" =~ ^[a-fA-F0-9]{7,40}$ ]]; then
            echo "Invalid image SHA."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Buildx
        if: ${{ github.event_name == 'push' || inputs.environment == 'dev' }}
        uses: docker/setup-buildx-action@v3

      - name: Build and push database
        if: ${{ github.event_name == 'push' || inputs.environment == 'dev' }}
        uses: docker/build-push-action@v6
        with:
          context: ./db
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Verify existing DEV image
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.environment != 'dev' }}
        run: |
          set -euo pipefail
          docker manifest inspect \
            "${IMAGE_REPOSITORY}:${IMAGE_TAG}" >/dev/null
          echo "Verified database image."

      - name: Deploy database only
        shell: bash
        run: |
          set -euo pipefail

          helm upgrade --install employee-database ./dev-chart \
            --namespace "app-${TARGET_ENV}" \
            --create-namespace \
            --set frontend.enabled=false \
            --set backend.enabled=false \
            --set database.enabled=true \
            --set-string database.image.repository="$IMAGE_REPOSITORY" \
            --set-string database.image.tag="$IMAGE_TAG" \
            --wait \
            --timeout 10m

      - name: Check deployment
        if: always()
        run: |
          kubectl get deployments,pods,services \
            -n "app-${TARGET_ENV}" || true
