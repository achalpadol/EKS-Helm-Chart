
name: Database Build and Promote

on:
  push:
    branches: [main]
    paths:
      - "db/**"
      - "dev-chart/**"
      - ".github/workflows/db-pipeline.yml"

  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        type: choice
        required: true
        default: dev
        options: [dev, qa, uat, prod]
      image_tag:
        description: "Existing DEV database image SHA for QA/UAT/PROD"
        type: string
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: database-${{ github.event_name == 'push' && 'dev' || inputs.environment }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  TARGET_ENV: ${{ github.event_name == 'push' && 'dev' || inputs.environment }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'development' || inputs.environment == 'dev' && 'development' || inputs.environment == 'prod' && 'production' || inputs.environment }}

    env:
      IMAGE_REPOSITORY: ${{ secrets.DOCKER_USERNAME }}/employee-db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate inputs
        env:
          IMAGE_INPUT: ${{ inputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TARGET_ENV" != "dev" ]]; then
            if [[ ! "$IMAGE_INPUT" =~ ^[a-fA-F0-9]{7,64}$ ]]; then
              echo "Enter a valid existing DEV database image SHA."
              exit 1
            fi
          fi

      - name: Select EKS cluster
        shell: bash
        run: |
          set -euo pipefail
          case "$TARGET_ENV" in
            dev)  CLUSTER="dev-eks-cluster" ;;
            qa)   CLUSTER="qa-eks-cluster" ;;
            uat)  CLUSTER="uat-eks-cluster" ;;
            prod) CLUSTER="prod-eks-cluster" ;;
            *) echo "Invalid environment"; exit 1 ;;
          esac
          echo "EKS_CLUSTER_NAME=$CLUSTER" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        id: configure_aws
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity and EKS cluster
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      - name: Update kubeconfig
        id: update_kubeconfig
        run: |
          set -euo pipefail
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"
          kubectl config current-context
          kubectl get --raw=/version

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        if: ${{ github.event_name == 'push' || inputs.environment == 'dev' }}
        uses: docker/setup-buildx-action@v3

      - name: Build and push database
        if: ${{ github.event_name == 'push' || inputs.environment == 'dev' }}
        uses: docker/build-push-action@v6
        with:
          context: ./db
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}

      - name: Select database image tag
        env:
          IMAGE_INPUT: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [[ "$TARGET_ENV" == "dev" ]]; then
            echo "IMAGE_TAG=$GITHUB_SHA" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=$IMAGE_INPUT" >> "$GITHUB_ENV"
          fi

      - name: Verify database image
        run: |
          set -euo pipefail
          docker manifest inspect \
            "$IMAGE_REPOSITORY:$IMAGE_TAG" >/dev/null
          echo "Verified database image."

      - name: Create target namespace
        run: |
          kubectl create namespace "app-${TARGET_ENV}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Configure Docker Hub pull secret
        env:
          DH_USER: ${{ secrets.DOCKER_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DH_USER"
          test -n "$DH_TOKEN"

          kubectl create secret docker-registry dockerhub-secret \
            --namespace="app-${TARGET_ENV}" \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username="$DH_USER" \
            --docker-password="$DH_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Validate Helm chart
        run: helm lint ./dev-chart

      - name: Deploy database only
        run: |
          set -euo pipefail

          helm upgrade --install employee-database ./dev-chart \
            --namespace "app-${TARGET_ENV}" \
            --create-namespace \
            --set frontend.enabled=false \
            --set backend.enabled=false \
            --set db.enabled=true \
            --set-string db.image.repository="$IMAGE_REPOSITORY" \
            --set-string db.image.tag="$IMAGE_TAG" \
            --wait \
            --timeout 10m

      - name: Check deployment
        if: ${{ always() && steps.configure_aws.outcome == 'success' && steps.update_kubeconfig.outcome == 'success' }}
        run: |
          kubectl get deployments,pods,services \
            -n "app-${TARGET_ENV}" || true
          kubectl get events -n "app-${TARGET_ENV}" \
            --sort-by=.metadata.creationTimestamp | tail -n 30 || true
