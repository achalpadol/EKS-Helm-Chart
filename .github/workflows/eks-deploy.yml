name: Deploy Application to EKS - Dev

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "backend/**"
      - "db/**"
      - "dev-chart/**"
      - ".github/workflows/eks-dev-deploy.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: dev-eks-cluster
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    name: Build, Push and Deploy Dev
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/app3-frontend:${{ github.sha }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/app3-backend:${{ github.sha }}

      - name: Build and Push Database Image
        uses: docker/build-push-action@v6
        with:
          context: ./db
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/app3-db:${{ github.sha }}

      - name: Create Dev Namespace
        run: |
          kubectl create namespace app-dev \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Configure Docker Hub Pull Secret
        run: |
          kubectl create secret docker-registry dockerhub-secret \
            --namespace app-dev \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username="$DOCKERHUB_USERNAME" \
            --docker-password="${{ secrets.DOCKERHUB_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Validate Helm Chart
        run: |
          helm lint ./dev-chart

      - name: Deploy Application to Dev
        run: |
          helm upgrade --install employee-app ./dev-chart \
            --namespace app-dev \
            --create-namespace \
            --set frontend.image.repository="$DOCKERHUB_USERNAME/app3-frontend" \
            --set frontend.image.tag="$IMAGE_TAG" \
            --set backend.image.repository="$DOCKERHUB_USERNAME/app3-backend" \
            --set backend.image.tag="$IMAGE_TAG" \
            --set db.image.repository="$DOCKERHUB_USERNAME/app3-db" \
            --set db.image.tag="$IMAGE_TAG" \
            --wait \
            --timeout 5m

      - name: Verify Deployment
        run: |
          kubectl get deployments -n app-dev
          kubectl get pods -n app-dev
          kubectl get services -n app-dev
