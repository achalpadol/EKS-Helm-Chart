
name: Employee App - Build and Promote

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "backend/**"
      - "db/**"
      - "dev-chart/**"
      - ".github/workflows/eks-deploy.yml"

  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        type: choice
        required: true
        default: dev
        options:
          - dev
          - qa
          - uat
          - prod

      frontend_tag:
        description: "Existing DEV frontend image tag (Git SHA)"
        type: string
        required: false

      backend_tag:
        description: "Existing DEV backend image tag (Git SHA)"
        type: string
        required: false

      db_tag:
        description: "Existing DEV database image tag (Git SHA)"
        type: string
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: employee-app-${{ github.event_name == 'push' && 'dev' || inputs.environment }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  deploy:
    name: Build or Promote - ${{ github.event_name == 'push' && 'dev' || inputs.environment }}
    runs-on: ubuntu-latest

    environment: ${{ github.event_name == 'push' && 'development' || inputs.environment == 'dev' && 'development' || inputs.environment == 'prod' && 'production' || inputs.environment }}

    env:
      TARGET_ENV: ${{ github.event_name == 'push' && 'dev' || inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Validate environment and promotion tags.
      - name: Validate inputs
        shell: bash
        env:
          FRONTEND_INPUT: ${{ inputs.frontend_tag }}
          BACKEND_INPUT: ${{ inputs.backend_tag }}
          DB_INPUT: ${{ inputs.db_tag }}
        run: |
          set -euo pipefail

          case "$TARGET_ENV" in
            dev|qa|uat|prod) ;;
            *)
              echo "Invalid target environment: $TARGET_ENV"
              exit 1
              ;;
          esac

          if [[ "$TARGET_ENV" == "dev" ]]; then
            echo "Dev will build images using commit: $GITHUB_SHA"
            exit 0
          fi

          for tag in "$FRONTEND_INPUT" "$BACKEND_INPUT" "$DB_INPUT"; do
            if [[ -z "$tag" ]]; then
              echo "All three image tags are required for QA/UAT/Prod."
              exit 1
            fi

            if [[ ! "$tag" =~ ^[a-fA-F0-9]{7,64}$ ]]; then
              echo "Image tags must be Git commit SHAs (7-64 hex characters)."
              exit 1
            fi
          done

          echo "All promotion inputs are valid."

      # Select the correct cluster for the selected environment.
      - name: Select EKS cluster
        shell: bash
        run: |
          set -euo pipefail

          case "$TARGET_ENV" in
            dev)  CLUSTER="dev-eks-cluster" ;;
            qa)   CLUSTER="qa-eks-cluster" ;;
            uat)  CLUSTER="uat-eks-cluster" ;;
            prod) CLUSTER="prod-eks-cluster" ;;
            *)
              echo "Invalid environment: $TARGET_ENV"
              exit 1
              ;;
          esac

          echo "EKS_CLUSTER_NAME=$CLUSTER" >> "$GITHUB_ENV"
          echo "Selected cluster: $CLUSTER"

      # Authenticate to AWS using GitHub OIDC.
      - name: Configure AWS credentials
        id: configure_aws
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity and EKS cluster
        id: verify_eks
        shell: bash
        run: |
          set -euo pipefail

          echo "=== AWS identity ==="
          aws sts get-caller-identity

          echo "=== EKS cluster ==="
          aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query 'cluster.{Name:name,Status:status,AuthMode:accessConfig.authenticationMode}' \
            --output table

      # Configure kubectl for the selected EKS cluster.
      - name: Update kubeconfig
        id: update_kubeconfig
        run: |
          set -euo pipefail

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

          kubectl config current-context

      # Test authentication before modifying Kubernetes resources.
      - name: Debug EKS authentication
        id: debug_eks
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Generate EKS token ==="
          aws eks get-token \
            --cluster-name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query 'status.expirationTimestamp' \
            --output text

          echo "=== Kubernetes API test ==="
          kubectl get --raw=/version

          echo "=== Namespace permission check ==="
          kubectl auth can-i create namespaces

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        if: ${{ github.event_name == 'push' || inputs.environment == 'dev' }}
        uses: docker/setup-buildx-action@v3

      # Build images only in Dev.
      - name: Build and push frontend
        if: ${{ github.event_name == 'push' || inputs.environment == 'dev' }}
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/employee-frontend:${{ github.sha }}

      - name: Build and push backend
        if: ${{ github.event_name == 'push' || inputs.environment == 'dev' }}
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/employee-backend:${{ github.sha }}

      - name: Build and push database
        if: ${{ github.event_name == 'push' || inputs.environment == 'dev' }}
        uses: docker/build-push-action@v6
        with:
          context: ./db
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/employee-db:${{ github.sha }}

      # Use the current commit in Dev and existing DEV image tags elsewhere.
      - name: Select image tags
        shell: bash
        env:
          FRONTEND_INPUT: ${{ inputs.frontend_tag }}
          BACKEND_INPUT: ${{ inputs.backend_tag }}
          DB_INPUT: ${{ inputs.db_tag }}
        run: |
          set -euo pipefail

          if [[ "$TARGET_ENV" == "dev" ]]; then
            echo "FRONTEND_TAG=$GITHUB_SHA" >> "$GITHUB_ENV"
            echo "BACKEND_TAG=$GITHUB_SHA" >> "$GITHUB_ENV"
            echo "DB_TAG=$GITHUB_SHA" >> "$GITHUB_ENV"
          else
            echo "FRONTEND_TAG=$FRONTEND_INPUT" >> "$GITHUB_ENV"
            echo "BACKEND_TAG=$BACKEND_INPUT" >> "$GITHUB_ENV"
            echo "DB_TAG=$DB_INPUT" >> "$GITHUB_ENV"
          fi

      - name: Verify selected images exist
        shell: bash
        run: |
          set -euo pipefail

          docker manifest inspect \
            "$DOCKER_USERNAME/employee-frontend:$FRONTEND_TAG" >/dev/null

          docker manifest inspect \
            "$DOCKER_USERNAME/employee-backend:$BACKEND_TAG" >/dev/null

          docker manifest inspect \
            "$DOCKER_USERNAME/employee-db:$DB_TAG" >/dev/null

          echo "Verified all three selected images."

      - name: Create target namespace
        run: |
          set -euo pipefail

          kubectl create namespace "app-${TARGET_ENV}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Configure Docker Hub pull secret
        env:
          DH_USER: ${{ secrets.DOCKER_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$DH_USER"
          test -n "$DH_TOKEN"

          kubectl create secret docker-registry dockerhub-secret \
            --namespace="app-${TARGET_ENV}" \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username="$DH_USER" \
            --docker-password="$DH_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Validate Helm chart
        run: helm lint ./dev-chart

      - name: Deploy application with Helm
        shell: bash
        run: |
          set -euo pipefail

          echo "Target environment: $TARGET_ENV"
          echo "EKS cluster: $EKS_CLUSTER_NAME"
          echo "Frontend tag: $FRONTEND_TAG"
          echo "Backend tag: $BACKEND_TAG"
          echo "Database tag: $DB_TAG"

          helm upgrade --install employee-app ./dev-chart \
            --namespace "app-${TARGET_ENV}" \
            --create-namespace \
            --set-string frontend.image.repository="$DOCKER_USERNAME/employee-frontend" \
            --set-string frontend.image.tag="$FRONTEND_TAG" \
            --set-string backend.image.repository="$DOCKER_USERNAME/employee-backend" \
            --set-string backend.image.tag="$BACKEND_TAG" \
            --set-string db.image.repository="$DOCKER_USERNAME/employee-db" \
            --set-string db.image.tag="$DB_TAG" \
            --wait \
            --timeout 10m

      # Do not run Kubernetes diagnostics if AWS or kubeconfig setup failed.
      - name: Check deployment
        if: ${{ always() && steps.configure_aws.outcome == 'success' && steps.update_kubeconfig.outcome == 'success' }}
        shell: bash
        run: |
          kubectl get deployments,pods,services \
            -n "app-${TARGET_ENV}" || true

          kubectl get events \
            -n "app-${TARGET_ENV}" \
            --sort-by=.metadata.creationTimestamp | tail -n 30 || true
