
name: Build and Deploy Employee App to EKS

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "backend/**"
      - "dev-chart/**"
      - ".github/workflows/deploy-eks.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
  K8S_NAMESPACE: app-dev
  HELM_RELEASE: employee-app

jobs:
  build-and-deploy:
    name: Build Images and Deploy with Helm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tag
        id: image
        shell: bash
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: achalpadol/employee-frontend:${{ steps.image.outputs.tag }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: achalpadol/employee-backend:${{ steps.image.outputs.tag }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Configure EKS access
        shell: bash
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

          kubectl get nodes

      - name: Validate Helm chart
        run: |
          helm lint ./dev-chart

      - name: Deploy application with Helm
        shell: bash
        run: |
          helm upgrade --install "$HELM_RELEASE" ./dev-chart \
            --namespace "$K8S_NAMESPACE" \
            --create-namespace \
            --set frontend.image.repository=achalpadol/employee-frontend \
            --set-string frontend.image.tag="${{ steps.image.outputs.tag }}" \
            --set backend.image.repository=achalpadol/employee-backend \
            --set-string backend.image.tag="${{ steps.image.outputs.tag }}" \
            --wait \
            --timeout 10m

      - name: Verify deployment
        run: |
          kubectl get deployments -n "$K8S_NAMESPACE"
          kubectl get pods -n "$K8S_NAMESPACE"
          kubectl get services -n "$K8S_NAMESPACE"
          helm status "$HELM_RELEASE" -n "$K8S_NAMESPACE"
