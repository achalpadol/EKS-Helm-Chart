
name: Frontend Build and Promote

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "dev-chart/**"
      - ".github/workflows/frontend-pipeline.yml"

  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        type: choice
        required: true
        default: dev
        options: [dev, qa, uat, prod]
      image_tag:
        description: "Existing DEV frontend image SHA for QA/UAT/PROD"
        type: string
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: employee-app-${{ github.event_name == 'push' && 'dev' || inputs.environment }}-helm
  cancel-in-progress: false

env:
  RELEASE: employee-app
  CHART: ./dev-chart
  AWS_REGION: ap-south-1
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  TARGET_ENV: ${{ github.event_name == 'push' && 'dev' || inputs.environment }}
  NAMESPACE: app-${{ github.event_name == 'push' && 'dev' || inputs.environment }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: ${{ github.event_name == 'push' && 'development' || inputs.environment == 'dev' && 'development' || inputs.environment == 'prod' && 'production' || inputs.environment }}

    env:
      IMAGE_REPOSITORY: ${{ secrets.DOCKER_USERNAME }}/employee-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select environment values file
        shell: bash
        run: |
          set -euo pipefail

          case "$TARGET_ENV" in
            dev)  VALUES_FILE="./dev-chart/values-dev.yaml" ;;
            qa)   VALUES_FILE="./dev-chart/values-qa.yaml" ;;
            uat)  VALUES_FILE="./dev-chart/values-uat.yaml" ;;
            prod) VALUES_FILE="./dev-chart/values-prod.yaml" ;;
            *) echo "Invalid environment: $TARGET_ENV"; exit 1 ;;
          esac

          test -f "$VALUES_FILE" || {
            echo "Values file not found: $VALUES_FILE"
            exit 1
          }

          echo "VALUES_FILE=$VALUES_FILE" >> "$GITHUB_ENV"
          echo "Selected values file: $VALUES_FILE"

      - name: Define deployment variables
        shell: bash
        run: |
          set -euo pipefail

          echo "Release: $RELEASE"
          echo "Chart: $CHART"
          echo "Namespace: $NAMESPACE"
          echo "Target environment: $TARGET_ENV"

      - name: Validate inputs
        env:
          IMAGE_INPUT: ${{ inputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$TARGET_ENV" != "dev" ]]; then
            if [[ ! "$IMAGE_INPUT" =~ ^[a-fA-F0-9]{40}$ ]]; then
              echo "Enter the full 40-character DEV frontend image commit SHA."
              exit 1
            fi
          fi

      - name: Select EKS cluster
        shell: bash
        run: |
          set -euo pipefail

          case "$TARGET_ENV" in
            dev)  CLUSTER="dev-eks-cluster" ;;
            qa)   CLUSTER="qa-eks-cluster" ;;
            uat)  CLUSTER="uat-eks-cluster" ;;
            prod) CLUSTER="prod-eks-cluster" ;;
            *) echo "Invalid environment"; exit 1 ;;
          esac

          echo "EKS_CLUSTER_NAME=$CLUSTER" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        id: configure_aws
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity and EKS cluster
        shell: bash
        run: |
          set -euo pipefail

          aws sts get-caller-identity

          aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      - name: Update kubeconfig
        id: update_kubeconfig
        shell: bash
        run: |
          set -euo pipefail

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

          kubectl config current-context
          kubectl get --raw=/version

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        if: ${{ github.event_name == 'push' || inputs.environment == 'dev' }}
        uses: docker/setup-buildx-action@v3

      # Build and push only for Dev.
      - name: Build and push frontend
        if: ${{ github.event_name == 'push' || inputs.environment == 'dev' }}
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}

      # Reuse the existing Dev image for QA, UAT and Prod.
      - name: Select frontend image tag
        env:
          IMAGE_INPUT: ${{ inputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$TARGET_ENV" == "dev" ]]; then
            IMAGE_TAG="$GITHUB_SHA"
          else
            IMAGE_TAG="$IMAGE_INPUT"
          fi

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "Selected image: $IMAGE_REPOSITORY:$IMAGE_TAG"

      - name: Verify frontend image exists
        shell: bash
        run: |
          set -euo pipefail

          docker manifest inspect \
            "$IMAGE_REPOSITORY:$IMAGE_TAG" >/dev/null

          echo "Verified frontend image: $IMAGE_REPOSITORY:$IMAGE_TAG"

      - name: Create target namespace
        shell: bash
        run: |
          set -euo pipefail

          kubectl create namespace "$NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Configure Docker Hub pull secret
        env:
          DH_USER: ${{ secrets.DOCKER_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$DH_USER"
          test -n "$DH_TOKEN"

          kubectl create secret docker-registry dockerhub-secret \
            --namespace="$NAMESPACE" \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username="$DH_USER" \
            --docker-password="$DH_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Validate Helm chart
        shell: bash
        run: |
          set -euo pipefail
          helm lint "$CHART" -f "$VALUES_FILE"

      # Keep all components enabled in this shared Helm release.
      # Update only the frontend image for this workflow.
      - name: Deploy frontend
        shell: bash
        run: |
          set -euo pipefail

          echo "Deploying release: $RELEASE"
          echo "Environment: $TARGET_ENV"
          echo "Namespace: $NAMESPACE"
          echo "Values file: $VALUES_FILE"
          echo "Frontend image: $IMAGE_REPOSITORY:$IMAGE_TAG"

          helm upgrade --install "$RELEASE" "$CHART" \
            --namespace "$NAMESPACE" \
            --create-namespace \
            -f "$VALUES_FILE" \
            --set frontend.enabled=true \
            --set backend.enabled=true \
            --set database.enabled=true \
            --set ingress.enabled=true \
            --set configMap.enabled=false \
            --set secret.enabled=false \
            --set-string frontend.image.repository="$IMAGE_REPOSITORY" \
            --set-string frontend.image.tag="$IMAGE_TAG" \
            --wait \
            --timeout 10m

      - name: Check deployment
        if: ${{ always() && steps.configure_aws.outcome == 'success' && steps.update_kubeconfig.outcome == 'success' }}
        shell: bash
        run: |
          kubectl get deployments,pods,services \
            -n "$NAMESPACE" || true

          kubectl get events -n "$NAMESPACE" \
            --sort-by=.metadata.creationTimestamp | tail -n 30 || true
