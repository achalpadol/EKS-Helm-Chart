
name: Frontend Build and Deploy DEV

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "dev-chart/**"
      - ".github/workflows/frontend.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: employee-app-dev-helm
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: dev-eks-cluster
  NAMESPACE: app-dev
  RELEASE: employee-app
  CHART: ./dev-chart

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment: development

    env:
      DEV_IMAGE: ${{ secrets.DOCKER_USERNAME }}/employee-frontend-dev

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Validate configuration
      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail

          test -f "$CHART/values-dev.yaml" || {
            echo "ERROR: $CHART/values-dev.yaml not found"
            exit 1
          }

          test -f "$CHART/Chart.yaml" || {
            echo "ERROR: $CHART/Chart.yaml not found"
            exit 1
          }

          echo "DEV configuration validated."

      # 3. Configure AWS credentials using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 4. Verify AWS identity and EKS cluster
      - name: Verify AWS and EKS
        shell: bash
        run: |
          set -euo pipefail

          aws sts get-caller-identity

          aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query 'cluster.status' \
            --output text

      # 5. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # 6. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 7. Build and push frontend image
      - name: Build and push DEV frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.DEV_IMAGE }}:${{ github.sha }}

      # 8. Verify the pushed image
      - name: Verify frontend image
        shell: bash
        run: |
          set -euo pipefail

          docker manifest inspect \
            "$DEV_IMAGE:$GITHUB_SHA" >/dev/null

          echo "Image successfully pushed:"
          echo "$DEV_IMAGE:$GITHUB_SHA"

      # 9. Connect to DEV EKS cluster
      - name: Update kubeconfig
        shell: bash
        run: |
          set -euo pipefail

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

          kubectl config current-context
          kubectl get --raw=/version

      # 10. Create DEV namespace
      - name: Create DEV namespace
        shell: bash
        run: |
          set -euo pipefail

          kubectl create namespace "$NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

      # 11. Configure Docker Hub pull secret
      - name: Configure Docker Hub pull secret
        env:
          DH_USER: ${{ secrets.DOCKER_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$DH_USER"
          test -n "$DH_TOKEN"

          kubectl create secret docker-registry dockerhub-secret \
            --namespace="$NAMESPACE" \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username="$DH_USER" \
            --docker-password="$DH_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      # 12. Validate Helm chart
      - name: Validate Helm chart
        shell: bash
        run: |
          set -euo pipefail

          helm lint "$CHART" \
            -f "$CHART/values-dev.yaml"

      # 13. Deploy DEV application using the newly built image
      - name: Deploy frontend to DEV
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$DEV_IMAGE:$GITHUB_SHA"
          echo "Environment: DEV"
          echo "Cluster: $EKS_CLUSTER_NAME"
          echo "Namespace: $NAMESPACE"
          echo "Frontend image: $DEV_IMAGE:$GITHUB_SHA"

          helm upgrade --install "$RELEASE" "$CHART" \
            --namespace "$NAMESPACE" \
            --create-namespace \
            -f "$CHART/values-dev.yaml" \
            --set frontend.enabled=true \
            --set backend.enabled=false \
            --set database.enabled=false \
            --set ingress.enabled=true \
            --set configMap.enabled=false \
            --set secret.enabled=false \
            --set-string frontend.image.repository="$DEV_IMAGE" \
            --set-string frontend.image.tag="$GITHUB_SHA" \
            --wait \
            --timeout 10m

      # 14. Verify deployment
      - name: Verify DEV deployment
        if: always()
        shell: bash
        run: |
          echo "Deployments:"
          kubectl get deployments -n "$NAMESPACE" || true

          echo "Pods:"
          kubectl get pods -n "$NAMESPACE" -o wide || true

          echo "Frontend deployment image:"
          kubectl get deployment \
            -n "$NAMESPACE" \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{range .spec.template.spec.containers[*]}{.image}{" "}{end}{"\n"}{end}' \
            || true

          echo "Recent events:"
          kubectl get events \
            -n "$NAMESPACE" \
            --sort-by=.metadata.creationTimestamp \
            | tail -n 30 || true

