
name: Frontend Build and Promote

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "dev-chart/**"
      - ".github/workflows/frontend-pipeline.yml"

  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        type: choice
        required: true
        default: dev
        options: [dev, qa, uat, prod]

      image_tag:
        description: "Existing frontend image SHA for QA/UAT/PROD"
        type: string
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: employee-app-${{ github.event_name == 'push' && 'dev' || inputs.environment }}-helm
  cancel-in-progress: false

env:
  RELEASE: employee-app
  CHART: ./dev-chart
  AWS_REGION: ap-south-1
  TARGET_ENV: ${{ github.event_name == 'push' && 'dev' || inputs.environment }}
  NAMESPACE: app-${{ github.event_name == 'push' && 'dev' || inputs.environment }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: ${{ github.event_name == 'push' && 'development' || inputs.environment == 'dev' && 'development' || inputs.environment == 'prod' && 'production' || inputs.environment }}

    env:
      DEV_IMAGE: ${{ secrets.DOCKER_USERNAME }}/employee-frontend-dev
      QA_IMAGE: ${{ secrets.DOCKER_USERNAME }}/employee-frontend-qa
      UAT_IMAGE: ${{ secrets.DOCKER_USERNAME }}/employee-frontend-uat
      PROD_IMAGE: ${{ secrets.DOCKER_USERNAME }}/employee-frontend-prod

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Select environment values file and EKS cluster
      # --------------------------------------------------

      - name: Select environment configuration
        shell: bash
        run: |
          set -euo pipefail

          case "$TARGET_ENV" in
            dev)
              VALUES_FILE="./dev-chart/values-dev.yaml"
              CLUSTER="dev-eks-cluster"
              ;;
            qa)
              VALUES_FILE="./dev-chart/values-qa.yaml"
              CLUSTER="qa-eks-cluster"
              ;;
            uat)
              VALUES_FILE="./dev-chart/values-uat.yaml"
              CLUSTER="uat-eks-cluster"
              ;;
            prod)
              VALUES_FILE="./dev-chart/values-prod.yaml"
              CLUSTER="prod-eks-cluster"
              ;;
            *)
              echo "Invalid environment: $TARGET_ENV"
              exit 1
              ;;
          esac

          test -f "$VALUES_FILE" || {
            echo "Values file not found: $VALUES_FILE"
            exit 1
          }

          echo "VALUES_FILE=$VALUES_FILE" >> "$GITHUB_ENV"
          echo "EKS_CLUSTER_NAME=$CLUSTER" >> "$GITHUB_ENV"

          echo "Environment: $TARGET_ENV"
          echo "Values file: $VALUES_FILE"
          echo "Cluster: $CLUSTER"

      # --------------------------------------------------
      # 3. Validate promotion input
      # --------------------------------------------------

      - name: Validate promotion inputs
        env:
          IMAGE_INPUT: ${{ inputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$TARGET_ENV" != "dev" ]]; then
            if [[ ! "$IMAGE_INPUT" =~ ^[a-fA-F0-9]{40}$ ]]; then
              echo "Enter the full 40-character frontend image SHA."
              exit 1
            fi
          fi

      # --------------------------------------------------
      # 4. Configure AWS credentials
      # --------------------------------------------------

      - name: Configure AWS credentials
        id: configure_aws
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity and EKS cluster
        shell: bash
        run: |
          set -euo pipefail

          aws sts get-caller-identity

          aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query 'cluster.status' \
            --output text

      # --------------------------------------------------
      # 5. Connect to EKS
      # --------------------------------------------------

      - name: Update kubeconfig
        id: update_kubeconfig
        shell: bash
        run: |
          set -euo pipefail

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

          kubectl config current-context
          kubectl get --raw=/version

      # --------------------------------------------------
      # 6. Login to Docker Hub
      # --------------------------------------------------

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # --------------------------------------------------
      # 7. Build and push frontend image ONLY in DEV
      # --------------------------------------------------

      - name: Set up Docker Buildx
        if: ${{ env.TARGET_ENV == 'dev' }}
        uses: docker/setup-buildx-action@v3

      - name: Build and push DEV frontend image
        if: ${{ env.TARGET_ENV == 'dev' }}
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.DEV_IMAGE }}:${{ github.sha }}

      # --------------------------------------------------
      # 8. Select promotion source and destination
      # --------------------------------------------------

      - name: Select frontend image repositories
        env:
          IMAGE_INPUT: ${{ inputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail

          case "$TARGET_ENV" in
            dev)
              SOURCE_IMAGE="$DEV_IMAGE"
              DEST_IMAGE="$DEV_IMAGE"
              IMAGE_TAG="$GITHUB_SHA"
              ;;
            qa)
              SOURCE_IMAGE="$DEV_IMAGE"
              DEST_IMAGE="$QA_IMAGE"
              IMAGE_TAG="$IMAGE_INPUT"
              ;;
            uat)
              SOURCE_IMAGE="$QA_IMAGE"
              DEST_IMAGE="$UAT_IMAGE"
              IMAGE_TAG="$IMAGE_INPUT"
              ;;
            prod)
              SOURCE_IMAGE="$UAT_IMAGE"
              DEST_IMAGE="$PROD_IMAGE"
              IMAGE_TAG="$IMAGE_INPUT"
              ;;
            *)
              echo "Invalid environment"
              exit 1
              ;;
          esac

          echo "SOURCE_IMAGE=$SOURCE_IMAGE" >> "$GITHUB_ENV"
          echo "DEST_IMAGE=$DEST_IMAGE" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

          echo "Source: $SOURCE_IMAGE:$IMAGE_TAG"
          echo "Destination: $DEST_IMAGE:$IMAGE_TAG"

      # --------------------------------------------------
      # 9. Pull source image
      # --------------------------------------------------

      - name: Pull source frontend image
        shell: bash
        run: |
          set -euo pipefail

          docker pull "$SOURCE_IMAGE:$IMAGE_TAG"

      # --------------------------------------------------
      # 10. Promote image WITHOUT rebuilding
      # --------------------------------------------------

      - name: Promote frontend image
        if: ${{ env.TARGET_ENV != 'dev' }}
        shell: bash
        run: |
          set -euo pipefail

          docker tag \
            "$SOURCE_IMAGE:$IMAGE_TAG" \
            "$DEST_IMAGE:$IMAGE_TAG"

          docker push "$DEST_IMAGE:$IMAGE_TAG"

          echo "Frontend image promoted successfully."

      # --------------------------------------------------
      # 11. Verify destination image
      # --------------------------------------------------

      - name: Verify frontend image
        shell: bash
        run: |
          set -euo pipefail

          docker manifest inspect \
            "$DEST_IMAGE:$IMAGE_TAG" >/dev/null

          echo "Verified image: $DEST_IMAGE:$IMAGE_TAG"

      # --------------------------------------------------
      # 12. Create target namespace
      # --------------------------------------------------

      - name: Create target namespace
        shell: bash
        run: |
          set -euo pipefail

          kubectl create namespace "$NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

      # --------------------------------------------------
      # 13. Configure Docker Hub pull secret
      # --------------------------------------------------

      - name: Configure Docker Hub pull secret
        env:
          DH_USER: ${{ secrets.DOCKER_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$DH_USER"
          test -n "$DH_TOKEN"

          kubectl create secret docker-registry dockerhub-secret \
            --namespace="$NAMESPACE" \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username="$DH_USER" \
            --docker-password="$DH_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      # --------------------------------------------------
      # 14. Validate Helm chart
      # --------------------------------------------------

      - name: Validate Helm chart
        shell: bash
        run: |
          set -euo pipefail

          helm lint "$CHART" -f "$VALUES_FILE"

      # --------------------------------------------------
      # 15. Deploy frontend
      # Update frontend image while keeping shared
      # backend, database, and ingress components enabled.
      # --------------------------------------------------

      - name: Deploy frontend
        shell: bash
        run: |
          set -euo pipefail

          echo "Release: $RELEASE"
          echo "Environment: $TARGET_ENV"
          echo "Namespace: $NAMESPACE"
          echo "Frontend image: $DEST_IMAGE:$IMAGE_TAG"

          helm upgrade --install "$RELEASE" "$CHART" \
            --namespace "$NAMESPACE" \
            --create-namespace \
            -f "$VALUES_FILE" \
            --set frontend.enabled=true \
            --set backend.enabled=true \
            --set database.enabled=true \
            --set ingress.enabled=true \
            --set configMap.enabled=false \
            --set secret.enabled=false \
            --set-string frontend.image.repository="$DEST_IMAGE" \
            --set-string frontend.image.tag="$IMAGE_TAG" \
            --wait \
            --timeout 10m

      # --------------------------------------------------
      # 16. Check deployment
      # --------------------------------------------------

      - name: Check deployment
        if: ${{ always() && steps.configure_aws.outcome == 'success' && steps.update_kubeconfig.outcome == 'success' }}
        shell: bash
        run: |
          kubectl get deployments,pods,services \
            -n "$NAMESPACE" || true

          kubectl get events \
            -n "$NAMESPACE" \
            --sort-by=.metadata.creationTimestamp | tail -n 30 || true
