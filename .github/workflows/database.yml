
name: Database Build and Promote

on:
  push:
    branches: [main]
    paths:
      - "db/**"
      - "dev-chart/**"
      - ".github/workflows/db-pipeline.yml"

  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        type: choice
        required: true
        default: dev
        options: [dev, qa, uat, prod]
      image_tag:
        description: "Existing DEV database image SHA for QA/UAT/PROD"
        type: string
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: database-${{ github.event_name == 'push' && 'dev' || inputs.environment }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  TARGET_ENV: ${{ github.event_name == 'push' && 'dev' || inputs.environment }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: ${{ github.event_name == 'push' && 'development' || inputs.environment == 'dev' && 'development' || inputs.environment == 'prod' && 'production' || inputs.environment }}

    env:
      IMAGE_REPOSITORY: ${{ secrets.DOCKER_USERNAME }}/employee-db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select environment values file
        shell: bash
        run: |
          set -euo pipefail

          case "$TARGET_ENV" in
            dev)  VALUES_FILE="./dev-chart/values-dev.yaml" ;;
            qa)   VALUES_FILE="./dev-chart/values-qa.yaml" ;;
            uat)  VALUES_FILE="./dev-chart/values-uat.yaml" ;;
            prod) VALUES_FILE="./dev-chart/values-prod.yaml" ;;
            *) echo "Invalid environment"; exit 1 ;;
          esac

          test -f "$VALUES_FILE" || {
            echo "Values file not found: $VALUES_FILE"
            exit 1
          }

          echo "VALUES_FILE=$VALUES_FILE" >> "$GITHUB_ENV"

      - name: Validate promotion inputs
        env:
          IMAGE_INPUT: ${{ inputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$TARGET_ENV" != "dev" ]]; then
            if [[ ! "$IMAGE_INPUT" =~ ^[a-fA-F0-9]{40}$ ]]; then
              echo "Enter the full 40-character DEV image commit SHA."
              exit 1
            fi
          fi

      - name: Select EKS cluster
        shell: bash
        run: |
          set -euo pipefail

          case "$TARGET_ENV" in
            dev)  CLUSTER="dev-eks-cluster" ;;
            qa)   CLUSTER="qa-eks-cluster" ;;
            uat)  CLUSTER="uat-eks-cluster" ;;
            prod) CLUSTER="prod-eks-cluster" ;;
            *) echo "Invalid environment"; exit 1 ;;
          esac

          echo "EKS_CLUSTER_NAME=$CLUSTER" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        id: configure_aws
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity and EKS cluster
        run: |
          set -euo pipefail

          aws sts get-caller-identity

          aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      - name: Update kubeconfig
        id: update_kubeconfig
        run: |
          set -euo pipefail

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

          kubectl config current-context
          kubectl get --raw=/version

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        if: ${{ github.event_name == 'push' || inputs.environment == 'dev' }}
        uses: docker/setup-buildx-action@v3

      # Build and push only for Dev.
      - name: Build and push database image
        if: ${{ github.event_name == 'push' || inputs.environment == 'dev' }}
        uses: docker/build-push-action@v6
        with:
          context: ./db
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}

      # QA, UAT and Prod reuse the existing Dev image SHA.
      - name: Select database image tag
        env:
          IMAGE_INPUT: ${{ inputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$TARGET_ENV" == "dev" ]]; then
            IMAGE_TAG="$GITHUB_SHA"
          else
            IMAGE_TAG="$IMAGE_INPUT"
          fi

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "Selected image: $IMAGE_REPOSITORY:$IMAGE_TAG"

      - name: Verify database image exists
        run: |
          set -euo pipefail

          docker manifest inspect \
            "$IMAGE_REPOSITORY:$IMAGE_TAG" >/dev/null

          echo "Verified image: $IMAGE_REPOSITORY:$IMAGE_TAG"

      - name: Create target namespace
        run: |
          set -euo pipefail

          kubectl create namespace "app-${TARGET_ENV}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Configure Docker Hub pull secret
        env:
          DH_USER: ${{ secrets.DOCKER_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: |
          set -euo pipefail

          test -n "$DH_USER"
          test -n "$DH_TOKEN"

          kubectl create secret docker-registry dockerhub-secret \
            --namespace="app-${TARGET_ENV}" \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username="$DH_USER" \
            --docker-password="$DH_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Validate Helm chart
        run: |
          set -euo pipefail
          helm lint ./dev-chart -f "$VALUES_FILE"

      - name: Deploy database only
        run: |
          set -euo pipefail

          helm upgrade --install employee-app ./dev-chart \
            --namespace "app-${TARGET_ENV}" \
            --create-namespace \
            -f "$VALUES_FILE" \
            --set frontend.enabled=false \
            --set backend.enabled=false \
            --set database.enabled=true \
            --set configMap.enabled=false \
            --set secret.enabled=true \
            --set ingress.enabled=false \
            --set-string database.image.repository="$IMAGE_REPOSITORY" \
            --set-string database.image.tag="$IMAGE_TAG" \
            --wait \
            --timeout 10m

      - name: Check deployment
        if: ${{ always() && steps.configure_aws.outcome == 'success' && steps.update_kubeconfig.outcome == 'success' }}
        shell: bash
        run: |
          kubectl get deployments,pods,services \
            -n "app-${TARGET_ENV}" || true

          kubectl get events -n "app-${TARGET_ENV}" \
            --sort-by=.metadata.creationTimestamp | tail -n 30 || true
